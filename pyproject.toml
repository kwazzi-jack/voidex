[project]
    name = "voidex"
    version = "0.1.0"
    description = "Add your description here"
    readme = "README.md"
    authors = [
        { name = "Brian Welman", email = "brianallisterwelman@gmail.com" },

    ]
    requires-python = ">=3.12"
    dependencies = [
        "appdirs>=1.4.4",
        "atomic-agents>=1.1.0",
        "chromadb>=1.0.7",
        "dotenv>=0.9.9",
        "instructor>=1.7.9",
        "marker-pdf>=1.6.2",
        "openai>=1.76.0",
        "pydantic>=2.10.3",
        "pymupdf>=1.25.5",
        "pymupdf4llm>=0.0.21",
        "sentence-transformers>=4.1.0",
        "streamlit>=1.44.1",
        "torch>=2.7.0",
        "tqdm>=4.67.1",
]

    [project.scripts]
        voidex = "voidex:main"

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
